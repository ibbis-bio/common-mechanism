base_paths:
  default: null
databases:
  biorisk:
    path: '{default}biorisk/biorisk.hmm'
    annotations: '{default}biorisk/biorisk_annotations.csv'
  best_match:
    path: "{default}best_match/"
    protein:
      path: "{default}best_match/protein/prot"
    nucleotide:
      path: "{default}best_match/nucleotide/nucl"
  low_concern:
    path: '{default}low_concern/'
    rna:
      path: '{default}low_concern/rna/low_concern.cm'
    dna:
      path: '{default}low_concern/dna/low_concern.fasta'
    protein:
      path: '{default}low_concern/protein/low_concern.hmm'
    annotations: '{default}low_concern/low_concern_annotations.csv'
  control_lists:
      path: "{default}control_lists/"
      regions : "all"
threads: 1
blast_mt_mode: 1
do_cleanup: False
force: False
skip_taxonomy_search: False
resume: False
skip_nt_search: False
verbose: False
auto_update_databases: False