base_paths:
  default: commec-dbs/
databases:
  biorisk:
    path: '{default}biorisk/biorisk.hmm'
    taxids: "{default}biorisk/reg_taxids.txt"
    annotations: '{default}biorisk/biorisk_annotations.csv'
  regulated_protein:
    blast:
      path: '{default}nr_blast/nr'
    diamond:
      path: '{default}nr_dmnd/nr.dmnd'
  regulated_nt:
    path: '{default}nt_blast/core_nt'
  low_concern:
    rna:
      path: '{default}low_concern/rna/low_concern.cm'
    dna:
      path: '{default}low_concern/dna/low_concern.fasta'
    protein:
      path: '{default}low_concern/protein/low_concern.hmm'
    taxids: "{default}low_concern/vax_taxids.txt"
    annotations: '{default}low_concern/low_concern_annotations.tsv'
  taxonomy:
      path: "{default}taxonomy/"
threads: 1
diamond_jobs: null
# Multithreading mode passed to blastn/blastx as -mt_mode (0, 1, or 2; 0 = auto).
# On fast local disk, 0 performs well across query sizes; for slow networked
# storage (e.g. HPC/NFS) 1 tends to be faster. Default 1 preserves prior behaviour.
blast_mt_mode: 1
do_cleanup: False
force: False
skip_taxonomy_search: False
protein_search_tool: 'blastx'
resume: False
skip_nt_search: False
verbose: False