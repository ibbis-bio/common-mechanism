{% set name = "commec" %}
{% set version = "2.0.0" %}
{% set sha256 = "" %}

package:
  name: "{{ name }}"
  version: "{{ version }}"

source:
  url: https://github.com/ibbis-bio/common-mechanism/archive/refs/tags/v{{version}}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv"
  run_exports:
    - {{ pin_subpackage('commec', max_pin="x.x.x") }}

requirements:
  build:
    - python >=3.10
    - pip
    - setuptools
  host:
    - python >=3.10
    - pip
    - setuptools
  # Keep in sync with environment.yaml, which is the authoritative dependency
  # list for the project (pyproject.toml declares no dependencies of its own).
  run:
    - python >=3.10,<3.14
    # Runtime Python dependencies
    - biopython
    - numpy
    - pandas
    - pyyaml
    - pycountry
    # Runtime non-Python dependencies
    - blast >=2.17
    - hmmer
    - infernal
    - wget
    - yaml
    # tar must support --zstd: `commec setup` shells out to it to extract the
    # .tar.zst reference database archives.
    - tar
    - zstd

test:
  commands:
    - commec --version
    - commec screen --help
    - commec flag --help
    - commec setup --help
    - commec list --help

about:
  home: https://github.com/ibbis-bio/common-mechanism
  license: MIT
  license_family: MIT
  doc_url: https://github.com/ibbis-bio/common-mechanism/wiki
  summary: "commec: a free, open-source, globally available tool for DNA sequence screening"
  dev_url: https://github.com/ibbis-bio/common-mechanism

extra:
  identifiers:
    - biotools:commec
  container:
    image: "quay.io/biocontainers/commec"