name: commec-dev
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.10,<3.14
  # Runtime Python dependencies
  - biopython
  - numpy
  - pandas
  - pyyaml
  - pycountry
  - openpyxl
  - xlrd
  - xlwt
  - oligraph
  # Web GUI (`commec gui`)
  - flask
  - psutil
  # Runtime non-Python dependencies
  - blast>=2.17
  - hmmer
  - infernal
  - yaml
  - wget
  - tar
  - zstd
  # Development dependencies
  - pip
  - pytest
  - matplotlib
  - ruff>=0.15.10,<0.16.0
  - pip:
      - -e .
