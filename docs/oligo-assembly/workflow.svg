<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">OliGraph assembly screening workflow</title>
  <desc id="desc">A multi-record FASTA follows direct oligo screening and OliGraph contig screening. Verified source placements support attribution to original oligos. Existing HTML tabs show direct and assembly evidence.</desc>
  <defs>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, sans-serif; fill: #18263d; }
      .sub { font: 17px -apple-system, BlinkMacSystemFont, sans-serif; fill: #536274; }
      .head { font: 700 19px -apple-system, BlinkMacSystemFont, sans-serif; fill: #18263d; }
      .body { font: 16px -apple-system, BlinkMacSystemFont, sans-serif; fill: #263a50; }
      .small { font: 15px -apple-system, BlinkMacSystemFont, sans-serif; fill: #536274; }
      .box { fill: #fff; stroke: #7592ab; stroke-width: 1.5; rx: 10; }
      .screen { fill: #edf5f8; stroke: #428aa5; stroke-width: 1.5; rx: 10; }
      .report { fill: #f0f5ed; stroke: #70955c; stroke-width: 1.5; rx: 10; }
      .arrow { fill: none; stroke: #465c71; stroke-width: 2; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#465c71"/></marker>
  </defs>
  <rect width="1180" height="610" fill="#fff"/>
  <text x="36" y="43" class="title">Oligo assembly screening with source attribution</text>
  <text x="36" y="71" class="sub">One FASTA file is one assembly scope. Assembly is disabled by default.</text>

  <rect x="35" y="103" width="305" height="105" class="box"/>
  <text x="58" y="135" class="head">1. Read the multi-record FASTA</text>
  <text x="58" y="164" class="body">Assign a stable identity to each oligo.</text>
  <text x="58" y="188" class="body">Preserve repeated headers and original order.</text>
  <text x="350" y="226" class="small">New module: commec/oligo_assembly.py</text>

  <path d="M188 208 L188 247 L188 278" class="arrow"/>
  <path d="M188 247 L858 247 L858 278" class="arrow"/>
  <text x="456" y="237" class="small">The same input follows two independent screening paths.</text>

  <rect x="35" y="282" width="305" height="110" class="screen"/>
  <text x="58" y="314" class="head">2A. Screen original oligos</text>
  <text x="58" y="343" class="body">Use the existing COMMEC pipeline.</text>
  <text x="58" y="367" class="body">Preserve direct hits, skips, and errors.</text>
  <text x="58" y="387" class="small">Modified integration: commec/screen.py</text>

  <rect x="515" y="99" width="610" height="105" class="box"/>
  <text x="538" y="131" class="head">2B. Assemble with OliGraph</text>
  <text x="538" y="160" class="body">Use exact suffix-to-prefix overlaps, minimum 15 bases.</text>
  <text x="538" y="184" class="body">Record paths, strands, source intervals, and exclusions.</text>

  <path d="M820 204 L820 232" class="arrow"/>
  <rect x="515" y="236" width="610" height="105" class="box"/>
  <text x="538" y="268" class="head">3B. Verify contig source placements</text>
  <text x="538" y="297" class="body">Replay each actual path and check its sequence.</text>
  <text x="538" y="321" class="body">Check every oriented source oligo, including reverse complements.</text>

  <path d="M820 341 L820 369" class="arrow"/>
  <rect x="515" y="373" width="305" height="115" class="screen"/>
  <text x="538" y="405" class="head">4B. Screen all contigs</text>
  <text x="538" y="434" class="body">Use a separate internal pass.</text>
  <text x="538" y="458" class="body">Keep COMMEC length gates.</text>
  <text x="538" y="480" class="small">Modified integration: commec/screen.py</text>

  <rect x="870" y="373" width="275" height="115" class="box"/>
  <text x="893" y="405" class="head">5B. Attribute concerns</text>
  <text x="893" y="434" class="body">Use final uncleared hits.</text>
  <text x="893" y="458" class="body">Map intervals to source oligos.</text>
  <text x="893" y="480" class="small">New module: oligo_assembly.py</text>
  <path d="M820 430 L870 430" class="arrow"/>

  <path d="M188 392 L188 515 L440 515" class="arrow"/>
  <path d="M1007 488 L1007 515 L750 515" class="arrow"/>
  <text x="395" y="507" class="small">Direct results remain available if assembly fails.</text>

  <rect x="390" y="529" width="410" height="65" class="report"/>
  <text x="595" y="556" text-anchor="middle" class="head">6. Combine evidence. 7. Report original oligos.</text>
  <text x="595" y="581" text-anchor="middle" class="body">Existing HTML tabs, JSON, CSV, and GUI summaries. No pool verdict.</text>
</svg>
